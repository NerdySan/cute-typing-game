name: Deploy to GitHub Pages

# 推送到 main 之後：先檢查，通過才部署到 GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch: # 也可以在 Actions 分頁手動按「Run workflow」

permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只保留最新一次部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 檢查語法與單字庫
        run: npm run check

  deploy:
    name: deploy
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - name: 準備要發布的檔案
        run: |
          mkdir _site
          cp index.html _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
