<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>萌萌打字大冒險</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--sky1:#bfe9ff;--sky2:#fff1d6;--ground:#8fdc7a;--ground2:#6cc457;--card:#fff;--ink:#4a3b6b;--accent:#ff7eb6;--accent2:#ffd24d;--done:#35b88a;--cloud:#ffffffcc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#2b2d6e;--sky2:#6b4a8f;--ground:#3f8f5a;--ground2:#2f7447;--card:#3a3470;--ink:#fff4fb;--cloud:#ffffff33}}
:root[data-theme="dark"]{--sky1:#2b2d6e;--sky2:#6b4a8f;--ground:#3f8f5a;--ground2:#2f7447;--card:#3a3470;--ink:#fff4fb;--cloud:#ffffff33}
*{box-sizing:border-box}
:root{--s:1;--hs:1}
html,body{height:100%;margin:0}
body{font-family:"Fredoka","Zen Maru Gothic","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--sky1);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--card);border-bottom:4px solid var(--accent2);font-weight:700;font-size:calc(18px*var(--hs))}
header .hearts{font-size:calc(20px*var(--hs));letter-spacing:1px}
button{font:inherit;cursor:pointer;border:0}
.icon{background:none;font-size:calc(22px*var(--hs));padding:2px 6px}
#stage{flex:1;position:relative;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2))}
.cloud{position:absolute;width:120px;height:40px;background:var(--cloud);border-radius:40px;animation:drift 60s linear infinite}
.cloud::before{content:"";position:absolute;left:22px;top:-18px;width:55px;height:55px;background:inherit;border-radius:50%}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
#ground{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--ground);border-top:6px solid var(--ground2);display:flex;align-items:center;justify-content:space-around;font-size:30px}
#feedGame{display:none;position:absolute;inset:0;z-index:2;overflow-y:auto;padding:16px;background:linear-gradient(#d5f3ff 0%,#fff2dc 68%,#b4e5a1 68%);color:#4a3b6b;text-align:center}
.feeding #feedGame{display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:8px}
.feeding .cloud,.feeding #ground,.feeding #hint,.feeding #msg{display:none}
body.feeding #levelStat,body.feeding #hearts,body.feeding #spd{display:none}
#feedGame h2{margin:0;font-size:clamp(20px,4vh,30px)}
#feedGame p{margin:0;font-size:15px}
#feedGame #feedLevel{font-size:clamp(16px,2.8vh,22px);font-weight:700;color:#9c4a60}
#feedQuestion{width:min(100%,440px);padding:10px 16px 14px;border:4px solid #ffc95c;border-radius:28px;background:#fffdf6;box-shadow:0 6px 0 #e7b980}
#feedIcon{font-size:clamp(42px,10vh,76px);line-height:1.2}
#feedQuestion .word{max-width:100%;font-size:clamp(18px,calc(26px*var(--s)),38px);white-space:normal;overflow-wrap:anywhere;border-color:#ffc95c;background:#fff8e6;color:#4a3b6b}
#feedAnimals{display:flex;align-items:end;justify-content:center;gap:clamp(4px,4vw,25px);width:100%}
#feedDog{position:relative;width:clamp(100px,25vh,220px);max-width:48%;aspect-ratio:550/670;transform-origin:50% 90%;animation:dogBreathe 3s ease-in-out infinite}
#feedDog img,#dogSad{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#feedDog::after{content:"✨";position:absolute;top:8%;right:-2%;font-size:clamp(18px,4vh,30px);opacity:0;pointer-events:none}
#feedDog.happy{animation:dogHappy .6s ease-in-out,dogBreathe 3s ease-in-out .6s infinite}
#feedDog.sad{animation:dogSad 1.8s ease-in-out infinite}
#feedTail{transform-origin:75% 86%;animation:tailIdle 2.4s ease-in-out infinite}
#feedDog.happy #feedTail{animation:tailWag .16s ease-in-out 6 alternate}
#feedDog.celebrate #feedTail{animation:tailWag .16s ease-in-out infinite alternate}
#dogSad{opacity:0;transition:opacity .2s}
#feedDog.sad #dogSad{opacity:1}
#feedDog.happy::after{animation:dogSparkle .8s ease-out}
#feedDog.celebrate::after{animation:dogSparkle 1s ease-in-out infinite}
#feedDog.celebrate{animation:dogDance .7s ease-in-out infinite alternate}
@keyframes dogBreathe{50%{transform:translateY(-3px) scale(1.015,.985)}}
@keyframes dogSad{50%{transform:translateY(3px) rotate(-4deg)}}
@keyframes tailIdle{50%{transform:rotate(10deg)}}
@keyframes dogHappy{25%{transform:rotate(-8deg) translateY(-8px)}75%{transform:rotate(8deg) translateY(-8px)}}
@keyframes dogSparkle{30%,70%{opacity:1;transform:translateY(-8px) scale(1.2)}100%{opacity:0;transform:translateY(-18px) scale(.8)}}
@keyframes tailWag{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes dogDance{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-28px) rotate(8deg)}}
#feedBowl{width:clamp(100px,22vh,190px);max-width:43%}
#feedBowl .portion[hidden]{display:none}
#bowlFacet[hidden]{display:none}
#feedGame #feedStatus{min-height:1.5em;font-size:clamp(20px,calc(22px*var(--s)),30px);line-height:1.35;font-weight:700}
#feedActions{display:flex;gap:12px}
#feedActions[hidden]{display:none}
#feedActions .btn{width:auto;margin:0;padding:10px 18px;font-size:18px}
@media (prefers-reduced-motion:reduce){#feedDog,#feedDog.happy,#feedDog.sad,#feedDog.celebrate,#feedTail,#feedDog.happy #feedTail,#feedDog.celebrate #feedTail,#feedDog.happy::after,#feedDog.celebrate::after{animation:none}#dogSad{transition:none}}
.mon{position:absolute;left:0;top:0;width:calc(100px*var(--s));display:flex;flex-direction:column;align-items:center;text-align:center;will-change:transform}
.mon svg{width:calc(84px*var(--s));height:calc(84px*var(--s));display:block;margin:0 auto;animation:bob .9s ease-in-out infinite}
.mon.locked svg{filter:drop-shadow(0 0 8px var(--accent2))}
@keyframes bob{50%{transform:translateY(-6px) scale(1.04,.96)}}
.word{display:inline-block;margin-top:2px;padding:3px 10px;background:var(--card);border:3px solid var(--accent);border-radius:18px;font-size:calc(22px*var(--s));font-weight:700;letter-spacing:2px;white-space:nowrap;color:var(--ink)}
.word.big{font-size:calc(32px*var(--s));padding:0 16px}
.word i{font-style:normal}
.word i.d{color:var(--done)}
.word i.n{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px}
.locked .word{border-color:var(--accent2);background:var(--accent2);color:#4a3b6b}
.shake .word{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop svg{animation:pop .45s forwards}
.ico{width:calc(84px*var(--s));height:calc(84px*var(--s));margin:0 auto;border-radius:50%;border:6px solid #ff8fb1;background:#fffbe9;display:flex;align-items:center;justify-content:center;font-size:calc(44px*var(--s));line-height:1;animation:bob .9s ease-in-out infinite}
.locked .ico{filter:drop-shadow(0 0 8px var(--accent2))}
.pop .ico{animation:pop .45s forwards}
.pop .word{opacity:0}
@keyframes pop{40%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(0);opacity:0}}
.star{position:absolute;font-size:22px;pointer-events:none;animation:fly .7s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.msg{position:absolute;left:0;right:0;top:18%;text-align:center;font-size:34px;font-weight:900;color:var(--accent);text-shadow:0 3px 0 var(--card);pointer-events:none;opacity:0}
.msg.show{animation:msg 1.1s}
@keyframes msg{20%{opacity:1;transform:scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.overlay{position:absolute;inset:0;display:flex;padding:16px;background:#2b2d6e66;z-index:5;overflow-y:auto}
.overlay[hidden]{display:none}
.panel{margin:auto;background:var(--card);border-radius:28px;padding:22px 20px;max-width:380px;width:100%;text-align:center;border:5px solid var(--accent2)}
.panel h1{margin:0 0 4px;font-size:30px;line-height:1.2}
.panel p{margin:4px 0 14px;font-size:16px;line-height:1.5}
.panel .buddies{font-size:40px;margin-bottom:6px}
.btn{display:block;width:100%;margin-top:10px;padding:13px;border-radius:22px;font-size:20px;font-weight:700;color:#4a3b6b;background:var(--accent2);box-shadow:0 5px 0 #e0a800}
.btn.p{background:var(--accent);box-shadow:0 5px 0 #d9468a;color:#fff}
.btn.g{background:#7fe0b5;box-shadow:0 5px 0 #3fb487}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0003}
.btn small{display:block;font-size:13px;font-weight:500;opacity:.8}
.spd{background:var(--accent2);color:#4a3b6b;border-radius:16px;padding:4px 10px;font-size:calc(15px*var(--hs));font-weight:700;box-shadow:0 3px 0 #e0a800;white-space:nowrap}
.spd:active{transform:translateY(2px);box-shadow:0 1px 0 #e0a800}
.btn.o{background:transparent;border:3px solid var(--accent2);box-shadow:none;color:var(--ink)}
#gl{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.mon{z-index:2}
#ground{z-index:0}
.msg{z-index:3}
.g3d .mon svg,.g3d .mon .ico{visibility:hidden}
.boom{animation:boom .35s}
@keyframes boom{0%{filter:brightness(1.25) saturate(1.25)}100%{filter:none}}
.btn.mini{width:auto;margin:0;padding:6px 12px;font-size:15px;display:inline-block;border-radius:16px}
.type{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:12px 14px;border-radius:22px;text-align:left;color:#4a3b6b;box-shadow:0 5px 0 #0003;font-size:20px;font-weight:700}
.type>span{font-size:38px;line-height:1}
.type b{display:block}
.type small{display:block;font-size:13px;font-weight:500;opacity:.8}
.type[data-type=game]{background:#ff9fc4}
.type[data-type=picture]{background:#ffca91}
.type[data-type=free]{background:#7fe0b5}
.type[data-type=abc]{background:#c6b3ff}
.type[data-type=lib]{background:#ffd24d}
.type:active{transform:translateY(4px);box-shadow:0 1px 0 #0003}
#free{background:linear-gradient(var(--sky1),var(--sky2));padding:12px;z-index:6}
.freeBox{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.freeTop{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:18px}
#bigKey{flex:none;height:clamp(110px,26vh,210px);display:flex;align-items:center;justify-content:center;font-size:clamp(90px,22vh,190px);font-weight:900;line-height:1}
#bigKey span{display:inline-block;animation:bigpop .35s}
@keyframes bigpop{0%{transform:scale(.3) rotate(-12deg);opacity:0}60%{transform:scale(1.2) rotate(4deg)}100%{transform:scale(1);opacity:1}}
#freeText{flex:1;min-height:0;overflow-y:auto;background:var(--card);border-radius:24px;border:5px solid var(--accent2);padding:14px;font-size:calc(40px*var(--s));font-weight:700;line-height:1.35;word-break:break-all;letter-spacing:3px}
.fl{display:inline-block;animation:bigpop .3s}
.freeHint{text-align:center;font-size:16px;opacity:.75}
#lib .panel{margin:0 auto;display:flex;flex-direction:column;padding:14px;min-height:0;text-align:left}
#lib h2{margin:0;font-size:22px}
.libHead{display:flex;align-items:center;justify-content:space-between}
#q{width:100%;padding:9px 12px;border-radius:14px;border:3px solid var(--accent2);background:transparent;color:var(--ink);font:inherit;font-size:16px;margin:8px 0 0;user-select:text;-webkit-user-select:text}
#libCount{font-size:13px;opacity:.75;margin:6px 2px}
#libList{flex:1;min-height:0;overflow-y:auto}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:14px;cursor:pointer}
.row:nth-child(odd){background:#ffd24d26}
.row .e{font-size:26px;width:34px;text-align:center}
.row .en{font-weight:700;font-size:18px;flex:1}
.row .zh{font-size:16px;opacity:.85}
.themes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.themes button{padding:6px 10px;border-radius:14px;background:transparent;border:3px solid var(--accent);color:var(--ink);font-size:15px;font-weight:700;opacity:.75}
.themes button.on{background:var(--accent);color:#fff;opacity:1;box-shadow:0 4px 0 #d9468a;transform:translateY(-2px) scale(1.06)}
.themes button.on::before{content:"✓ "}
.diff{display:flex;gap:8px}
.diff button{flex:1;padding:9px 4px;border-radius:16px;background:transparent;border:3px solid var(--accent2);color:var(--ink);font-size:17px;font-weight:700}
.diff button.on{background:var(--accent2);color:#4a3b6b;box-shadow:0 3px 0 #e0a800}
.panel p.cnt{margin:8px 0 4px;font-size:14px;opacity:.85}
#inp{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;left:0;top:0}
.hint{position:absolute;bottom:72px;left:0;right:0;text-align:center;font-size:14px;opacity:.7}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:420px){header{font-size:calc(15px*var(--hs));padding:8px;gap:2px 4px}header .hearts{font-size:calc(15px*var(--hs));letter-spacing:0}.spd{padding:4px 7px;font-size:calc(13px*var(--hs))}.icon{font-size:calc(20px*var(--hs));padding:2px 3px}}
@media (prefers-reduced-motion:reduce){.cloud,.mon svg,.mon .ico{animation:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<header>
  <span>⭐ <span id="score">0</span></span>
  <span id="levelStat">Lv <span id="lv">1</span></span>
  <span class="hearts" id="hearts"></span>
  <button class="icon" id="homeBtn" aria-label="回到首頁">🏠</button>
  <button class="spd" id="sizeBtn" aria-label="字型大小">Aa 中</button>
  <button class="spd" id="spd" aria-label="切換速度">🐰 正常</button>
  <button class="icon" id="mute" aria-label="開關聲音">🔊</button>
</header>
<div id="stage">
  <div class="cloud" style="top:12%;animation-delay:-10s"></div>
  <div class="cloud" style="top:38%;animation-delay:-38s;transform:scale(.7)"></div>
  <canvas id="gl"></canvas>
  <div id="feedGame">
    <h2 id="feedHeading">🐾 陪狗狗吃飯吧！</h2>
    <p id="feedLevel"></p>
    <p id="feedIntro">打出圖像下方的單字，讓狗狗吃一口～</p>
    <div id="feedQuestion">
      <div id="feedIcon" aria-hidden="true"></div>
      <div class="word"></div>
    </div>
    <div id="feedAnimals">
      <div id="feedDog" role="img" aria-label="可愛的柯基狗狗">
        <img id="feedTail" src="assets/corgi-tail.png" alt="">
        <img id="dogBody" src="assets/corgi-body.png" alt="">
        <svg id="dogSad" viewBox="0 0 550 670" aria-hidden="true">
          <defs><radialGradient id="sadMuzzle"><stop offset="55%" stop-color="#fff0de"/><stop offset="100%" stop-color="#fff0de" stop-opacity="0"/></radialGradient></defs>
          <ellipse cx="256" cy="365" rx="102" ry="54" fill="url(#sadMuzzle)"/>
          <path d="M230 377 Q256 350 282 377" fill="none" stroke="#755047" stroke-width="6" stroke-linecap="round"/>
          <path d="M143 296 Q130 316 144 325 Q158 316 143 296Z" fill="#90dbf2" stroke="#fff" stroke-width="3"/>
        </svg>
      </div>
      <svg id="feedBowl" viewBox="0 0 180 125" role="img" aria-label="食物盆">
        <ellipse cx="90" cy="109" rx="75" ry="10" fill="#79534b" opacity=".15"/>
        <defs>
          <clipPath id="foodClip"><ellipse cx="90" cy="53" rx="73" ry="25"/></clipPath>
          <linearGradient id="bowlBronze" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3bf8a"/><stop offset=".45" stop-color="#c57840"/><stop offset="1" stop-color="#8f4a2d"/></linearGradient>
          <linearGradient id="bowlSilver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fafb"/><stop offset=".45" stop-color="#c1c8d0"/><stop offset="1" stop-color="#7e8d9d"/></linearGradient>
          <linearGradient id="bowlGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5a0"/><stop offset=".45" stop-color="#ffcb36"/><stop offset="1" stop-color="#c68b0c"/></linearGradient>
          <linearGradient id="bowlPlatinum" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2faff"/><stop offset=".45" stop-color="#a8c8d8"/><stop offset="1" stop-color="#64849f"/></linearGradient>
          <linearGradient id="bowlDiamond" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7ffff"/><stop offset=".45" stop-color="#70e6f4"/><stop offset="1" stop-color="#1b9ed0"/></linearGradient>
          <linearGradient id="bowlRainbow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff829e"/><stop offset=".22" stop-color="#ffca65"/><stop offset=".43" stop-color="#f5ec74"/><stop offset=".63" stop-color="#83dfa8"/><stop offset=".82" stop-color="#79baf5"/><stop offset="1" stop-color="#c397ec"/></linearGradient>
        </defs>
        <ellipse cx="90" cy="53" rx="75" ry="27" fill="#fff0d3" stroke="#755047" stroke-width="4"/>
        <g clip-path="url(#foodClip)">
          <g class="portion"><rect x="17" y="27" width="29" height="52" fill="#c7854b"/><ellipse cx="34" cy="48" rx="9" ry="6" fill="#88502f"/></g>
          <g class="portion"><rect x="47" y="27" width="29" height="52" fill="#c7854b"/><ellipse cx="62" cy="41" rx="9" ry="6" fill="#88502f"/></g>
          <g class="portion"><rect x="77" y="27" width="29" height="52" fill="#c7854b"/><ellipse cx="91" cy="49" rx="9" ry="6" fill="#88502f"/></g>
          <g class="portion"><rect x="107" y="27" width="29" height="52" fill="#c7854b"/><ellipse cx="121" cy="41" rx="9" ry="6" fill="#88502f"/></g>
          <g class="portion"><rect x="137" y="27" width="27" height="52" fill="#c7854b"/><ellipse cx="148" cy="48" rx="9" ry="6" fill="#88502f"/></g>
        </g>
        <path id="bowlFinish" d="M16 53 Q21 104 44 108 H136 Q159 104 164 53 Q90 78 16 53Z" fill="url(#bowlBronze)" stroke="#755047" stroke-width="4"/>
        <path id="bowlFacet" d="M31 64 L68 73 L45 101 M68 73 L90 106 L112 73 M112 73 L149 64 L135 101" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2" hidden/>
        <path d="M78 86 Q90 70 102 86 Q90 100 78 86Z" fill="#fff5df"/>
      </svg>
    </div>
    <p id="feedStatus" aria-live="polite"></p>
    <div id="feedActions" hidden>
      <button class="btn p" id="feedRestart">再玩一次</button>
      <button class="btn" id="feedHome">回到首頁</button>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="hint" id="hint"></div>
  <div id="ground"><span>🌷</span><span>🏡</span><span>🐰</span><span>🌼</span><span>🍄</span></div>
  <input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="打字輸入">

  <div class="overlay" id="hub">
    <div class="panel">
      <div class="buddies">👾🐙👻</div>
      <h1>萌萌打字大冒險</h1>
      <p>選一個想玩的遊戲吧！</p>
      <button class="type" data-type="game"><span>🐙</span><div><b>單字打怪物</b><small>短單字、長單字，可選難度和主題</small></div></button>
      <button class="type" data-type="picture"><span>🐶</span><div><b>單字圖像大冒險</b><small>打單字，陪狗狗開心吃飯</small></div></button>
      <button class="type" data-type="abc"><span>🔤</span><div><b>ABC 字母打怪物</b><small>一次打一個字母，最適合剛開始學</small></div></button>
      <button class="type" data-type="free"><span>⌨️</span><div><b>自由敲敲樂</b><small>隨便敲鍵盤，看字母跳出來</small></div></button>
      <button class="type" data-type="lib" id="libBtn"><span>📖</span><div><b>單字字庫</b><small>中英文對照，可依分類查詢</small></div></button>
    </div>
  </div>
  <div class="overlay" id="free" hidden>
    <div class="freeBox">
      <div class="freeTop"><span>⌨️ 自由敲敲樂</span><span><button class="btn mini" id="freeClear">🧹 清除</button> <button class="btn mini p" id="freeBack">🏠 回選單</button></span></div>

/* ---------- sound ---------- */
let ac;
function tone(f,d=.12,t='sine',v=.07){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=t;o.frequency.value=f;g.gain.value=v;
    o.connect(g);g.connect(ac.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d);
  }catch(e){}
}
const SPD=[{e:'🐢',n:'慢',k:.7,b:1},{e:'🐰',n:'正常',k:1,b:1},{e:'🚀',n:'快',k:1.5,b:2}];
let spdIdx=1;
$('#spd').onclick=()=>{
  spdIdx=(spdIdx+1)%SPD.length;
  const s=SPD[spdIdx];
  $('#spd').textContent=s.e+' '+s.n;
  if(running)say(s.b>1?s.e+' 加速！星星 ×'+s.b:s.e+' '+s.n+'速');
  tone(400+spdIdx*150,.1);inp.focus();
};
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';inp.focus()};

/* ---------- monster art ---------- */
function monsterSVG(c,k){
  const eyes=k===1
    ?'<circle cx="50" cy="48" r="13" fill="#fff"/><circle cx="52" cy="49" r="6" fill="#4a3b6b"/><circle cx="54" cy="46" r="2" fill="#fff"/>'
    :'<circle cx="38" cy="48" r="9" fill="#fff"/><circle cx="62" cy="48" r="9" fill="#fff"/><circle cx="40" cy="49" r="4.5" fill="#4a3b6b"/><circle cx="64" cy="49" r="4.5" fill="#4a3b6b"/><circle cx="42" cy="47" r="1.6" fill="#fff"/><circle cx="66" cy="47" r="1.6" fill="#fff"/>';
  const top=[
    '<path d="M28 28 L22 10 L40 22Z M72 28 L78 10 L60 22Z" fill="#fff6c9" stroke="#4a3b6b" stroke-width="3" stroke-linejoin="round"/>',
    '<path d="M50 20 V6" stroke="#4a3b6b" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="6" r="5" fill="#ff7eb6" stroke="#4a3b6b" stroke-width="2"/>',
    '<circle cx="26" cy="24" r="10" fill="'+c+'" stroke="#4a3b6b" stroke-width="3"/><circle cx="74" cy="24" r="10" fill="'+c+'" stroke="#4a3b6b" stroke-width="3"/>',
    '<path d="M30 24 L36 10 L44 22 L50 8 L56 22 L64 10 L70 24Z" fill="#fff6c9" stroke="#4a3b6b" stroke-width="3" stroke-linejoin="round"/>'
  ][k];
  const mouth=['<path d="M40 66 Q50 76 60 66" fill="#fff" stroke="#4a3b6b" stroke-width="3" stroke-linecap="round"/>',
    '<ellipse cx="50" cy="70" rx="8" ry="6" fill="#ff7a8a" stroke="#4a3b6b" stroke-width="3"/>'][k%2];
  return '<svg viewBox="0 0 100 100" aria-hidden="true">'+top+
    '<path d="M14 62 C14 30 30 20 50 20 C70 20 86 30 86 62 C86 82 78 90 70 90 L62 84 L54 90 L46 84 L38 90 L30 90 C20 90 14 82 14 62Z" fill="'+c+'" stroke="#4a3b6b" stroke-width="3.5" stroke-linejoin="round"/>'+
    '<ellipse cx="28" cy="62" rx="6" ry="4" fill="#ff7eb6" opacity=".55"/><ellipse cx="72" cy="62" rx="6" ry="4" fill="#ff7eb6" opacity=".55"/>'+

/* ---------- game ---------- */
function pickWord(){
  const used=mons.map(m=>m.word[0]);
  if(mode==='letters'){
    const pool='asdfghjklqwertyuiopzxcvbnm'.split('').filter(l=>!used.includes(l)&&!recent.includes(l));
    return pool[Math.floor(Math.random()*pool.length)];
  }
  const bank=getBank(mode);
  const pool=bank.filter(w=>!used.includes(w[0])&&!recent.includes(w));
  return pool[Math.floor(Math.random()*pool.length)]||bank[Math.floor(Math.random()*bank.length)];
}
function renderWord(m){
  const w=m.el.querySelector('.word');
  w.innerHTML=m.word.split('').map((ch,i)=>
    '<i class="'+(i<m.i?'d':i===m.i&&(m===target||pictureMode)?'n':'')+'">'+(mode==='letters'?ch.toUpperCase():ch)+'</i>').join('');
}
function addMonster(){
  const W=stage.clientWidth,word=pickWord();
  recent.push(word);if(recent.length>(mode==='letters'?3:12))recent.shift();
  const el=document.createElement('div');
  el.className='mon';
  const col=COLORS[Math.floor(Math.random()*COLORS.length)],kind=Math.floor(Math.random()*4);
  const art=EMO[word]?'<div class="ico" style="border-color:'+col+'">'+EMO[word]+'</div>':monsterSVG(col,kind);
  el.innerHTML=art+'<div class="word'+(mode==='letters'?' big':'')+'"></div>';
  const w=Math.round(100*SIZES[sizeIdx].m),p=Math.round(50*SIZES[sizeIdx].m);
  const x=p+Math.random()*Math.max(10,W-w-2*p);
  const m={el,word,i:0,x,y:-110,v:0,col,kind,ph:Math.random()*6};
  mons.push(m);stage.appendChild(el);renderWord(m);
}
function hearts(){$('#hearts').textContent='❤️'.repeat(lives)+'🤍'.repeat(5-lives)}
function say(t){const m=$('#msg');m.textContent=t;m.classList.remove('show');void m.offsetWidth;m.classList.add('show')}
function hud(){$('#score').textContent=score;$('#lv').textContent=level;hearts()}

function start(md){
  mode=md;mons.forEach?.call(mons,m=>m.el.remove());
  document.querySelectorAll('.mon,.star').forEach(e=>e.remove());
  mons=[];score=0;lives=5;level=1;kills=0;combo=0;target=null;spawn=.6;last=performance.now();running=true;
  $('#menu').hidden=true;$('#over').hidden=true;
  $('#hint').textContent=md==='letters'?'看到字母，就按鍵盤上的同一個鍵！':'把單字一個字母一個字母打出來，打錯要重來喔！';
  hud();inp.focus();requestAnimationFrame(loop);
}
function loop(t){
  if(!running||pictureMode)return;
  const dt=Math.min(.1,(t-last)/1000);last=t;
  const floor=stage.clientHeight-64-Math.round(110*SIZES[sizeIdx].m);
  const speed=(26+level*4)*SPD[spdIdx].k;
  spawn-=dt;
  if(spawn<=0&&mons.length<Math.min(2+Math.floor(level/2),5)){addMonster();spawn=Math.max(1.5,3.4-level*.18)/SPD[spdIdx].k}
  for(const m of mons.slice()){
    m.y+=speed*dt;
    m.el.style.transform='translate('+m.x+'px,'+m.y+'px)';
    if(m.y>floor)hit(m);
  }
  if(running)requestAnimationFrame(loop);
}
function hit(m){
  mons=mons.filter(x=>x!==m);
  if(target===m)target=null;
  m.el.remove();fxBoom(m,true);combo=0;lives--;tone(180,.25,'triangle',.09);hud();say('沒關係，再來！');
  if(lives<=0)end();
}
function end(){
  running=false;
  if(score>best){best=score;try{localStorage.setItem('typing-best',best)}catch(e){}}
  $('#fs').textContent=score;$('#best').textContent=best;$('#over').hidden=false;
  tone(523,.15);setTimeout(()=>tone(659,.15),150);setTimeout(()=>tone(784,.3),300);
}
function stars(m){
  for(let k=0;k<7;k++){
    const s=document.createElement('span');
    s.className='star';s.textContent=k%2?'⭐':'✨';
    s.style.left=(m.x+42)+'px';s.style.top=(m.y+34)+'px';
    s.style.setProperty('--dx',(Math.random()*120-60)+'px');
    s.style.setProperty('--dy',(Math.random()*120-70)+'px');
    stage.appendChild(s);setTimeout(()=>s.remove(),750);

function femaleVoice(){

  const ok=en.filter(v=>!MALE_RE.test(v.name));

  const pool=fem.length?fem:ok;
  const sc=x=>(/natural|neural|online/i.test(x.name)?100:0)+(/premium|enhanced/i.test(x.name)?60:0)+(/^en[-_]US/i.test(x.lang)?20:0)-Math.max(0,FEM_PREF.findIndex(n=>x.name.includes(n)));

        ms.position.x+=p.vx*dt;ms.position.y+=p.vy*dt;ms.position.z+=p.vz*dt;
        ms.rotation.x+=p.rx*dt;ms.rotation.y+=p.ry*dt;
        p.life-=dt*1.3;ms.material.opacity=Math.max(0,p.life);
        if(p.life<=0){sc.remove(ms);ms.material.dispose();parts.splice(i,1)}
      }
      for(let i=rings.length-1;i>=0;i--){
        const p=rings[i];p.life-=dt*2.4;
        p.mesh.scale.setScalar(1+(1-p.life)*7);p.mesh.material.opacity=Math.max(0,p.life);
        if(p.life<=0){sc.remove(p.mesh);p.mesh.material.dispose();rings.splice(i,1)}
      }
      if(shake>0){
        cam.position.x=(Math.random()-.5)*shake;cam.position.y=(Math.random()-.5)*shake;
        shake*=Math.exp(-dt*8);
        if(shake<.4){shake=0;cam.position.set(0,0,cz)}
      }
      const idle=!objs.size&&!parts.length&&!rings.length&&!shake;
      if(idle){if(!cleared){r.render(sc,cam);cleared=true}}
      else{
        cleared=false;r.render(sc,cam);
        if(!ok3d){
          const m0=mons.find(q=>q.y>40&&q.y<H-200);
          if(m0&&++seen>25){
            const gl=r.getContext(),dpr=r.getPixelRatio(),px=new Uint8Array(4);
            gl.readPixels(Math.round((m0.x+50*s)*dpr),Math.round((H-(m0.y+42*s))*dpr),1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
            if(px[3]===0)throw new Error('3d blank');
            ok3d=true;
          }
        }
      }
    }
    requestAnimationFrame(frame);
    FX={on:true,setOn(v){this.on=v;stage.classList.toggle('g3d',v);cv.style.display=v?'':'none'},boom(m,bad){
      const s=SIZES[sizeIdx].m,cx=m.x+50*s-W/2,cy=H/2-(m.y+42*s);
      const base=new T.Color(bad?0xff5a5a:m.col),n=bad?26:48;
      for(let i=0;i<n;i++){
        const g=!bad&&i%3===0;
        const mat=S(g?0xffd24d:base,{transparent:true,emissive:g?0x8a6a00:0x000000});
        const mesh=new T.Mesh(G.star,mat);mesh.scale.setScalar((g?9:5)+Math.random()*7);
        mesh.position.set(cx,cy,10);
        const a=Math.random()*6.283,sp=200+Math.random()*420;
        parts.push({mesh,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp+120,vz:(Math.random()-.2)*500,rx:Math.random()*8,ry:Math.random()*8,life:1});
        sc.add(mesh);
      }
      const rm=new T.Mesh(G.wave,new T.MeshBasicMaterial({color:bad?0xff5a5a:0xffffff,transparent:true}));
      rm.position.set(cx,cy,20);sc.add(rm);rings.push({mesh:rm,life:1});
      shake=Math.max(shake,bad?18:Math.min(20,8+combo*1.6));
      stage.classList.remove('boom');void stage.offsetWidth;stage.classList.add('boom');
    }};
    stage.classList.add('g3d');
  }catch(e){FX=null;try{$('#gl').style.display='none'}catch(_){}}
})();
(function(){
  const b=$('#fxBtn');
  if(!FX){b.style.display='none';return}
  try{fxEnabled=localStorage.getItem('typing-3d')!=='0'}catch(e){}
  const set=()=>{updateFX();b.textContent='✨ 3D 畫面：'+(fxEnabled?'開':'關')};
  set();
  b.onclick=()=>{fxEnabled=!fxEnabled;set();try{localStorage.setItem('typing-3d',fxEnabled?'1':'0')}catch(e){}};
})();
mons=[];hearts();
</script>
</body>
</html>
